---
version: '3'
volumes:
  data:

services:
  # some simulated IOCs
  caproto-hello-world:
    image: caproto
    build: 
      context: ../caproto
      dockerfile: Containerfile
    tty: true
    init: true
  caproto-0:
    image: caproto
    build: 
      context: ../caproto
      dockerfile: Containerfile
    command: python3 -m caproto.ioc_examples.mini_beamline -v
    tty: true
    init: true
  caproto-1:
    image: caproto
    build: 
      context: ../caproto
      dockerfile: Containerfile
    command: python3 -m caproto.ioc_examples.random_walk -v
    tty: true
    init: true
  caproto-2:
    image: caproto
    build: 
      context: ../caproto
      dockerfile: Containerfile
    command: python3 -m caproto.ioc_examples.random_walk -v  --prefix="random_walk:horiz-"
    tty: true
    init: true
  caproto-3:
    image: caproto
    build: 
      context: ../caproto
      dockerfile: Containerfile
    command: python3 -m caproto.ioc_examples.random_walk -v  --prefix="random_walk:vert-"
    tty: true
    init: true
  caproto-4:
    image: caproto
    build: 
      context: ../caproto
      dockerfile: Containerfile
    command: python3 -m caproto.ioc_examples.simple -v
    tty: true
    init: true
  caproto-5:
    image: caproto
    build: 
      context: ../caproto
      dockerfile: Containerfile
    command: python3 -m caproto.ioc_examples.thermo_sim -v
    tty: true
    init: true

  # zmq bridge
  zmq-proxy:
    image: bluesky
    build:
      context: ../bluesky
      dockerfile: Containerfile.latest
    command: bluesky-0MQ-proxy 4567 5678

  # tiled
  tiled:
    image: tiled
    build:
      context: ../tiled
      dockerfile: Containerfile
    volumes:
      - data:/nsls2/data/mad
      - ../../bluesky_config/tiled:/usr/local/share/tiled:ro,z
    command: tiled serve catalog --init /nsls2/data/mad/catalog.db -w /nsls2/data/mad/data -w duckdb:////nsls2/data/mad/data.duckdb --api-key secret --host 0.0.0.0

  # redis
  redis:
    image: docker.io/redis

  # jupyter spy
  jupyter:
    image: quay.io/jupyter/scipy-notebook
    command: start-notebook.py --IdentityProvider.token='' --NotebookApp.base_url='/jlab' --NotebookApp.allow_origin='*'
    volumes:
      - ../..//bluesky_config/:/home/jovyan/config
      - ../../bluesky_config/databroker:/usr/local/share/intake

  # QS parts
  # Loads QServer looking at an ipython profile named profile_qserver, optionally loaded from BLUESKY_PROFILE_DIR
  queue_manager:
    image: bluesky
    build:
      context: ../bluesky
      dockerfile: Containerfile.latest
    command: start-re-manager --startup-profile qserver --zmq-publish-console ON --redis-addr redis
    environment:
      - IPYTHONDIR=/usr/local/share/ipython
      - PYTHONPATH=/usr/local/share/ipython
    volumes:
      - ${BLUESKY_PROFILE_DIR:-../../bluesky_config/ipython/profile_default}:/usr/local/share/ipython/profile_qserver:ro
      - ../../bluesky_config/databroker:/usr/local/share/intake:ro
      - ../../bluesky_config/ipython/localdevs.py:/usr/local/share/ipython/localdevs.py:ro
      - ../../bluesky_config/databroker/mad-tiled.yml:/etc/tiled/profiles/mad-tiled.yml:ro,z
      - ../../bluesky_config/happi:/usr/local/share/happi:ro
    depends_on:
      redis:
        condition: service_started

  qs_api:
    image: bluesky
    build:
      context: ../bluesky
      dockerfile: Containerfile.latest
    command: uvicorn --host qs_api --port 60610 bluesky_httpserver.server:app
    environment:
      - QSERVER_HTTP_SERVER_SINGLE_USER_API_KEY=mad
      - QSERVER_ZMQ_CONTROL_ADDRESS=tcp://queue_manager:60615
      - QSERVER_ZMQ_INFO_ADDRESS=tcp://queue_manager:60625
    depends_on:
      queue_manager:
        condition: service_started

  proxy:
    image: docker.io/nginx
    init: true
    ports:
      - "127.0.0.1:11973:11973"
    volumes:
      - ../../bluesky_config/nginx/compose.conf:/etc/nginx/nginx.conf:ro,z
      - ../../bluesky_config/nginx/locs.d:/etc/nginx/locs.d:ro,z
      - ../../bluesky_config/nginx/index.html:/var/www/html/index.html:ro,z
    depends_on:
      jupyter:
        condition: service_started
      qs_api:
        condition: service_started
  
  ophyd-service:
    image: bluesky
    ports:
      - "127.0.0.1:60620:60620"
    build:
      context: ../bluesky
      dockerfile: Containerfile.latest
    environment:
      - OPHYD_SERVICE_CONFIG=/usr/local/share/ophyd-service/config.yml
      - OPHYD_SERVICE_SINGLE_USER_API_KEY=a
    volumes:
      - ../../bluesky_config/ophyd-service:/usr/local/share/ophyd-service:ro,z
    command: uvicorn --host 0.0.0.0 --port 60620 ophyd_service.server:app